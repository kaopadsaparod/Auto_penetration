# ============================================================
# AI Pentesting Agent — Docker Compose
# ============================================================
# Services:
#   agent   — the pentesting agent container
#   target  — optional vulnerable target for testing
# ============================================================

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pentest-agent
    volumes:
      - ./data:/app/data              # Persist PTT database and RAG store
      - ./config.yaml:/app/config.yaml  # Mount config for easy editing
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access Ollama on host machine
    networks:
      - pentest-net
    stdin_open: true                  # For HITL approval prompts
    tty: true

  # Optional: vulnerable target for local testing
  # Uncomment to use DVWA as a test target
  # target:
  #   image: vulnerables/web-dvwa
  #   container_name: pentest-target
  #   ports:
  #     - "8080:80"
  #   networks:
  #     pentest-net:
  #       ipv4_address: 10.10.10.100

networks:
  pentest-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
